<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>謎解き</title>

<link rel="stylesheet" href="css/style.css">

<script src="js/questions.js"></script>

</head>

<body>

<h1 id="title"></h1>

<img id="questionImage" width="600">

<p id="question"></p>

<input id="answer" type="text" placeholder="答えを入力">

<br><br>

<button onclick="checkAnswer()">回答</button>
<button onclick="showHint()">ヒント</button>
<button onclick="location.href='history.html'">
振り返る
</button>
<p id="hint"></p>
<p id="result"></p>

<script>

const params = new URLSearchParams(window.location.search);

let id = Number(params.get("id"));

if (!id) {
    id = 1;
}

const currentQuestion =
    questions.find(q => q.id === id);

document.getElementById("title").innerHTML =
    currentQuestion.title;

document.getElementById("question").innerHTML =
    currentQuestion.question;

document.getElementById("questionImage").src =
    currentQuestion.image;

function checkAnswer() {

    const answer =
        document.getElementById("answer")
        .value
        .trim();

    if(currentQuestion.answers.includes(answer)){

    document.getElementById("result").innerHTML =
        "✅ 正解！";

    document.getElementById("result").style.color =
        "#00ff88";

    localStorage.setItem(
        "currentPuzzle",
        id + 1
    );

    setTimeout(function(){

        if(id < questions.length){

            location.href =
                "puzzle.html?id=" + (id + 1);

        } else {

            location.href =
                "clear.html";

        }

        }, 1500);

    } else {

        document.getElementById("result").innerHTML =
            "❌ 不正解";

        document.getElementById("result").style.color =
            "#ff5555";

    }

}



function showHint() {

    document.getElementById("hint").innerHTML =
        currentQuestion.hint;

}

</script>

</body>
</html>
